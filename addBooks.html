<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book List</title>

  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/skeleton/2.0.4/skeleton.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600&display=swap">
  <link rel="stylesheet" href="addBookStyle.css" />
  <link rel="preload" as="image" href="images/addbooks-bgimg.jpg">


</head>

<body class="addbooks-body">
  <div class="page-wrapper">
    <div class="content-box">
      <h2>Library Dashboard</h2>

      <form id="form-list">
        <div class="mb-3">
          <label class="form-label">Title</label>
          <input type="text" id="title" class="form-control">
        </div>
        <div class="mb-3">
          <label class="form-label">Author</label>
          <input type="text" id="author" class="form-control">
        </div>
        <div class="mb-3">
          <label class="form-label">ISBN#</label>
          <input type="text" id="isbn" class="form-control">
        </div>
        <div class="text-center">
          <button class=" col btn btn-dark px-50">Submit</button>
          <a href="index.html" class="col btn btn-dark px-50">Back to Home</a>
        </div>
      </form>

      <table class="table table-bordered mt-4 text-center align-middle">
        <thead class="table-secondary">
          <tr>
            <th>Title</th>
            <th>Author</th>
            <th>ISBN</th>
            <th>Remove</th>
          </tr>
        </thead>
        <tbody id="book-list"></tbody>
      </table>
    </div>
  </div>

  <script src="./script.js"></script>
</body>

</html>
